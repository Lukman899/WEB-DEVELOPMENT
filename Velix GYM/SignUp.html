<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>VELIX GYM</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="output.css">

    <style>
        .heading {
            font-family: "Montserrat", sans-serif;
        }
    </style>

</head>

<body class="min-h-screen bg-[#090909] text-white">

    <header class="flex w-full flex-col items-center justify-between border-b border-white/10 bg-black/80 px-5 py-5 backdrop-blur-md md:flex-row md:px-8">

        <div>
            <h1 class="text-2xl font-extrabold tracking-tight">
                VELIX <span class="text-lime-300">GYM</span>
            </h1>
        </div>

        <nav class="mt-4 flex items-center gap-6 text-sm font-bold text-gray-300 md:mt-0 md:gap-8">
            <a href="index.html" class="transition hover:text-lime-300">Home</a>
            <a href="SignUp.html" class="text-lime-300">SignUp</a>
            <a href="Contact.html" class="transition hover:text-lime-300">Contact Us</a>
        </nav>

    </header>

    <main class="min-h-screen bg-[linear-gradient(rgba(0,0,0,0.72),rgba(0,0,0,0.82)),url('bg2velixgym.png')] bg-cover bg-center bg-fixed px-6 py-16">

        <a href="index.html"
            class="inline-block text-sm font-medium text-gray-400 transition hover:text-lime-300">
            ← Back To Home
        </a>

        <section class="mt-8">

            <h1 class="heading text-4xl font-extrabold leading-none tracking-tight md:text-6xl lg:text-7xl">
                START YOUR
                <br>
                <span class="text-lime-300">JOURNEY</span>
            </h1>

            <p class="mt-5 max-w-xl text-sm text-gray-500 md:text-base">
                Fill in your details to get started with your fitness journey.
            </p>

        </section>

        <section class="mt-10 w-full max-w-3xl rounded-2xl border border-white/10 bg-[#111111] p-5 shadow-2xl shadow-black/30 md:p-8">

            <h2 class="text-lg font-bold">
                Selected Plan
            </h2>

            <div class="mt-4 rounded-xl border border-lime-300/20 bg-[#181818] p-4">

                <div class="flex items-center justify-between gap-4">

                    <div class="flex min-w-0 items-center gap-3">

                        <img src="premiumCrown.jpg"
                            alt="Premium Plan"
                            class="h-11 w-11 shrink-0 rounded-lg object-cover">

                        <div class="min-w-0">
                            <h3 class="font-bold">Premium Plan</h3>
                            <p class="mt-1 text-xs text-gray-500">
                                All Premium Features Included
                            </p>
                        </div>

                    </div>

                    <div class="shrink-0">
                        <p class="font-bold text-lime-300">
                            <span class="text-2xl">$59</span>
                            <span class="text-xs text-gray-500">/month</span>
                        </p>
                    </div>

                </div>

            </div>

            <form action="" class="mt-8">

                <div class="flex flex-col">
                    <label for="name" class="mb-2 text-sm font-bold">
                        Full Name
                    </label>

                    <input type="text"
                        id="name"
                        placeholder="Enter your full name"
                        class="w-full rounded-md border border-white/10 bg-[#181818] px-3 py-3 text-sm text-white outline-none transition placeholder:text-gray-600 focus:border-lime-300">
                </div>

                <div class="mt-6 grid grid-cols-1 gap-5 md:grid-cols-2">

                    <div class="flex flex-col">
                        <label for="age" class="mb-2 text-sm font-bold">
                            Age
                        </label>

                        <input type="text"
                            id="age"
                            placeholder="Enter your age"
                            class="w-full rounded-md border border-white/10 bg-[#181818] px-3 py-3 text-sm text-white outline-none transition placeholder:text-gray-600 focus:border-lime-300">
                    </div>

                    <div class="flex flex-col">
                        <label for="gender" class="mb-2 text-sm font-bold">
                            Gender
                        </label>

                        <select name="Gender"
                            id="gender"
                            class="w-full cursor-pointer rounded-md border border-white/10 bg-[#181818] px-3 py-3 text-sm text-white outline-none focus:border-lime-300">

                            <option value="">Select</option>
                            <option value="male">Male</option>
                            <option value="female">Female</option>

                        </select>
                    </div>

                </div>

                <div class="mt-6 flex flex-col">
                    <label for="email" class="mb-2 text-sm font-bold">
                        Email
                    </label>

                    <input type="email"
                        id="email"
                        placeholder="Enter your email address"
                        class="w-full rounded-md border border-white/10 bg-[#181818] px-3 py-3 text-sm text-white outline-none transition placeholder:text-gray-600 focus:border-lime-300">
                </div>

                <div class="mt-6 flex flex-col">
                    <label for="phone" class="mb-2 text-sm font-bold">
                        Phone Number
                    </label>

                    <input type="tel"
                        id="phone"
                        placeholder="Enter your phone number"
                        class="w-full rounded-md border border-white/10 bg-[#181818] px-3 py-3 text-sm text-white outline-none transition placeholder:text-gray-600 focus:border-lime-300">
                </div>

                <div class="mt-6 flex flex-col">
                    <label for="password" class="mb-2 text-sm font-bold">
                        Password
                    </label>

                    <input type="password"
                        id="password"
                        placeholder="Enter your password"
                        class="w-full rounded-md border border-white/10 bg-[#181818] px-3 py-3 text-sm text-white outline-none transition placeholder:text-gray-600 focus:border-lime-300">
                </div>

                <div class="mt-6 flex flex-col">
                    <label for="confirm" class="mb-2 text-sm font-bold">
                        Confirm Password
                    </label>

                    <input type="password"
                        id="confirm"
                        placeholder="Confirm your password"
                        class="w-full rounded-md border border-white/10 bg-[#181818] px-3 py-3 text-sm text-white outline-none transition placeholder:text-gray-600 focus:border-lime-300">
                </div>

                <div class="mt-6 flex flex-col">
                    <label for="plan" class="mb-2 text-sm font-bold">
                        Select Plan
                    </label>

                    <select name="Plan"
                        id="plan"
                        class="w-full cursor-pointer rounded-md border border-white/10 bg-[#181818] px-3 py-3 text-sm text-white outline-none focus:border-lime-300">

                        <option value="">Choose A Plan</option>
                        <option value="Basic Plan">Basic Plan</option>
                        <option value="Premium Plan">Premium Plan</option>
                        <option value="Elite Plan">Elite Plan</option>

                    </select>
                </div>

                <button type="submit"
                    class="mt-8 w-full rounded-md bg-lime-300 py-3 font-bold text-black transition hover:bg-lime-200 active:scale-[0.99]">
                    Sign Up →
                </button>

            </form>

        </section>

    </main>

    <script src="index.js"></script>

</body>

</html>
