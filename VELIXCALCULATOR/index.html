<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VELIX CALCULATOR</title>
    <link rel="stylesheet" href="output.css">
</head>

<body>


    <section>

        <div class=" border-2 border-black w-fit mx-auto p-4 rounded-xl bg-gray-400">
            <div class=" grid justify-center items-center m-3 ">
                <input type="text" placeholder="0"
                    class=" border-2 border-black w-fit mx-auto p-4 rounded-xl bg-gray-300"> <br><br>
            </div>
            <div class="grid grid-cols-4 gap-3 w-fit mx-auto">
                <button class="w-12 h-12 rounded-full bg-white hover:bg-blue-300 active:bg-blue-300">AC</button>
                <button class="w-12 h-12 rounded-full bg-white hover:bg-blue-300 active:bg-blue-300">%</button>
                <button class="w-12 h-12 rounded-full bg-white hover:bg-blue-300 active:bg-blue-300">DEL</button>
                <button
                    class="w-12 h-12 rounded-full bg-slate-700 text-white hover:bg-blue-400 active:bg-blue-400">/</button>

                <button class="w-12 h-12 rounded-full bg-white hover:bg-blue-300 active:bg-blue-300">7</button>
                <button class="w-12 h-12 rounded-full bg-white hover:bg-blue-300 active:bg-blue-300">8</button>
                <button class="w-12 h-12 rounded-full bg-white hover:bg-blue-300 active:bg-blue-300">9</button>
                <button
                    class="w-12 h-12 rounded-full bg-slate-700 text-white hover:bg-blue-400 active:bg-blue-400">*</button>

                <button class="w-12 h-12 rounded-full bg-white hover:bg-blue-300 active:bg-blue-300">4</button>
                <button class="w-12 h-12 rounded-full bg-white hover:bg-blue-300 active:bg-blue-300">5</button>
                <button class="w-12 h-12 rounded-full bg-white hover:bg-blue-300 active:bg-blue-300">6</button>
                <button
                    class="w-12 h-12 rounded-full bg-slate-700 text-white hover:bg-blue-400 active:bg-blue-400">−</button>

                <button class="w-12 h-12 rounded-full bg-white hover:bg-blue-300 active:bg-blue-300">1</button>
                <button class="w-12 h-12 rounded-full bg-white hover:bg-blue-300 active:bg-blue-300">2</button>
                <button class="w-12 h-12 rounded-full bg-white hover:bg-blue-300 active:bg-blue-300">3</button>
                <button
                    class="w-12 h-12 rounded-full bg-slate-700 text-white hover:bg-blue-400 active:bg-blue-400">+</button>

                <button class="w-12 h-12 rounded-full bg-white hover:bg-blue-300 active:bg-blue-300">00</button>
                <button class="w-12 h-12 rounded-full bg-white hover:bg-blue-300 active:bg-blue-300">0</button>
                <button class="w-12 h-12 rounded-full bg-white hover:bg-blue-300 active:bg-blue-300">.</button>
                <button
                    class="w-12 h-12 rounded-full bg-orange-500 text-white hover:bg-blue-400 active:bg-blue-400">=</button>
            </div>
        </div>
    </section>






    <script src="index.js"></script>
</body>

</html>
