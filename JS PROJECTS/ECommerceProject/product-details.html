<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VELIX | Product Details</title>
  <link rel="stylesheet" href="output.css">
  <link rel="stylesheet" href="css/style.css">
  

<style>
    #product-detail-container h1,
    #product-detail-container h2,
    #product-detail-container .text-slate-900,
    #product-detail-container .text-slate-800,
    #product-detail-container .text-gray-900,
    #product-detail-container .text-gray-800 {
        color: #ffffff !important;
    }

    #product-detail-container p,
    #product-detail-container .text-slate-600,
    #product-detail-container .text-slate-500,
    #product-detail-container .text-gray-600,
    #product-detail-container .text-gray-500 {
        color: #b3b3b3 !important;
    }

    #product-detail-container .text-teal-700,
    #product-detail-container .text-teal-600 {
        color: #ef4444 !important;
    }

    #product-detail-container div:has(> #qty-minus):has(> #qty-value):has(> #qty-plus) {
        display: flex;
        align-items: center;
        background-color: #252525 !important;
        border: 1px solid #444444 !important;
        border-radius: 8px !important;
        overflow: hidden;
    }

    #product-detail-container #qty-minus,
    #product-detail-container #qty-plus {
        background-color: #252525 !important;
        color: #ffffff !important;
        border: none !important;
        min-width: 42px;
        height: 42px;
        cursor: pointer;
    }

    #product-detail-container #qty-value {
        background-color: #252525 !important;
        color: #ffffff !important;
        border: none !important;
        text-align: center;
    }

    #product-detail-container #qty-minus svg,
    #product-detail-container #qty-plus svg {
        color: #ffffff !important;
        stroke: currentColor !important;
    }

    #product-detail-container #qty-minus:hover,
    #product-detail-container #qty-plus:hover {
        background-color: #383838 !important;
        color: #ef4444 !important;
    }

    #product-detail-container #qty-minus:hover svg,
    #product-detail-container #qty-plus:hover svg {
        color: #ef4444 !important;
    }

    #product-detail-container #add-to-cart-btn {
        background-color: #dc2626 !important;
        border-color: #dc2626 !important;
        color: #ffffff !important;
    }

    #product-detail-container #add-to-cart-btn:hover {
        background-color: #b91c1c !important;
    }

    #product-detail-container #add-to-wishlist-btn {
        background-color: transparent !important;
        color: #ef4444 !important;
        border: 1px solid #dc2626 !important;
    }

    #product-detail-container #add-to-wishlist-btn:hover {
        background-color: #dc2626 !important;
        color: #ffffff !important;
        border-color: #dc2626 !important;
    }

    #product-detail-container #add-to-wishlist-btn span {
        color: inherit !important;
    }

    #product-detail-container #add-to-wishlist-btn svg {
        color: inherit !important;
        stroke: currentColor !important;
    }

    #product-detail-container .bg-white {
        background-color: #1c1c1c !important;
    }

    #product-detail-container .border-slate-200,
    #product-detail-container .border-slate-300 {
        border-color: #404040 !important;
    }

    #product-detail-container img {
        max-width: 100%;
        object-fit: contain;
    }
</style>


</head>

<body class="velix-store min-h-screen flex flex-col bg-[#111111] text-white font-sans antialiased">

  <header class="bg-[#111111] border-b border-[#303030] sticky top-0 z-50">
    <div class="max-w-6xl mx-auto px-4 sm:px-8 min-h-20 py-4 flex flex-wrap items-center justify-between gap-4">

      <a href="index.html" class="text-2xl font-black tracking-tight text-white shrink-0">
        VELIX<span class="text-red-500">.</span>
      </a>

      <nav class="flex items-center gap-3 sm:gap-6 text-xs sm:text-sm font-semibold">
        <a href="index.html" class="text-gray-400 hover:text-red-500 transition">
          HOME
        </a>

        <a href="wishlist.html" class="text-gray-400 hover:text-red-500 transition flex items-center gap-1.5">
          WISHLIST
          <span id="wishlist-count" class="bg-red-600 text-white px-2 py-0.5 rounded-full text-xs">2</span>
        </a>

        <a href="cart.html" class="text-gray-400 hover:text-red-500 transition flex items-center gap-1.5">
          CART
          <span id="cart-count" class="bg-red-600 text-white px-2 py-0.5 rounded-full text-xs">3</span>
        </a>
      </nav>

    </div>
  </header>

  <main class="flex-grow w-full max-w-6xl mx-auto px-4 sm:px-8 py-10 sm:py-16">

    <div class="text-center mb-10">
      <p class="text-red-500 text-xs font-bold tracking-[3px] mb-4">
        VELIX COLLECTION
      </p>

      <h1 class="text-3xl sm:text-5xl font-black tracking-tight">
        PRODUCT <span class="text-red-500">DETAILS.</span>
      </h1>

      <p class="text-gray-400 text-sm mt-5">
        Discover the details. Find your perfect pick.
      </p>
    </div>

    <div class="mb-8">
      <a href="index.html" class="inline-flex items-center gap-2 text-sm text-gray-400 hover:text-red-500 transition">
        <span aria-hidden="true">←</span>
        Back to Products
      </a>
    </div>

    <div id="product-detail-container">
      <!-- Product details rendered by main.js -->
    </div>

  </main>

  <footer class="border-t border-[#303030] py-6 mt-auto">
    <div class="max-w-6xl mx-auto px-4 text-center text-sm text-gray-500">
      © 2026 VELIX. All rights reserved.
    </div>
  </footer>

  <script src="main.js"></script>
</body>

</html>
