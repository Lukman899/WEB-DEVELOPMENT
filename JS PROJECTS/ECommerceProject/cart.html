
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VELIX | Shopping Cart</title>
    <link rel="stylesheet" href="output.css">
    <link rel="stylesheet" href="css/style.css">

    <style>
        #cart-container .bg-white {
            background-color: #1c1c1c !important;
        }

        #cart-container .border-slate-200,
        #cart-container .border-slate-300 {
            border-color: #353535 !important;
        }

        #cart-container .divide-slate-200 > :not(:first-child) {
            border-color: #353535 !important;
        }

        #cart-container .text-slate-900,
        #cart-container .text-slate-800,
        #cart-container .text-gray-900,
        #cart-container .text-gray-800 {
            color: #ffffff !important;
        }

        #cart-container .text-slate-500,
        #cart-container .text-slate-600,
        #cart-container .text-slate-400,
        #cart-container .text-gray-500,
        #cart-container .text-gray-600 {
            color: #b3b3b3 !important;
        }

        #cart-container .text-teal-700 {
            color: #ef4444 !important;
        }

        #cart-container .cart-qty-minus,
        #cart-container .cart-qty-plus {
            background-color: #252525 !important;
            color: #ffffff !important;
            cursor: pointer;
        }

        #cart-container .cart-qty-minus svg,
        #cart-container .cart-qty-plus svg {
            stroke: currentColor !important;
        }

        #cart-container .cart-qty-minus:hover,
        #cart-container .cart-qty-plus:hover {
            background-color: #383838 !important;
            color: #ef4444 !important;
        }

        #cart-container .cart-qty-minus + span {
            background-color: #252525 !important;
            color: #ffffff !important;
            align-self: stretch;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #cart-container div:has(> .cart-qty-minus):has(> .cart-qty-plus) {
            background-color: #252525 !important;
            border: 1px solid #444444 !important;
            border-radius: 8px !important;
            overflow: hidden;
        }

        #cart-container .cart-wishlist-btn {
            color: #ef4444 !important;
        }

        #cart-container .cart-wishlist-btn:hover {
            background-color: #352020 !important;
            color: #ffffff !important;
        }

        #cart-container .cart-remove-btn {
            color: #a3a3a3 !important;
        }

        #cart-container .cart-remove-btn:hover {
            background-color: #352020 !important;
            color: #ef4444 !important;
        }

        #cart-container #checkout-btn,
        #cart-container .bg-teal-700 {
            background-color: #dc2626 !important;
            color: #ffffff !important;
        }

        #cart-container #checkout-btn:hover,
        #cart-container .hover\:bg-teal-800:hover {
            background-color: #b91c1c !important;
        }

        #cart-container img {
            max-width: 100%;
            object-fit: contain;
        }

        #cart-container a:hover {
            color: #ef4444 !important;
        }

        #cart-container button,
        #cart-container a {
            transition: background-color 0.2s ease, color 0.2s ease;
        }
    </style>
</head>

<body class="velix-store min-h-screen flex flex-col bg-[#111111] text-white font-sans antialiased">

    <header class="bg-[#111111] border-b border-[#303030] sticky top-0 z-50">
        <div class="max-w-6xl mx-auto px-4 sm:px-8 min-h-20 py-4 flex flex-wrap items-center justify-between gap-4">

            <a href="index.html"
                class="text-2xl font-black tracking-tight text-white shrink-0">
                VELIX<span class="text-red-500">.</span>
            </a>

            <nav class="flex items-center gap-3 sm:gap-6 text-xs sm:text-sm font-semibold">

                <a href="index.html"
                    class="text-gray-400 hover:text-red-500 transition">
                    HOME
                </a>

                <a href="wishlist.html"
                    class="text-gray-400 hover:text-red-500 transition flex items-center gap-1.5">
                    WISHLIST
                    <span id="wishlist-count"
                        class="bg-red-600 text-white px-2 py-0.5 rounded-full text-xs">0</span>
                </a>

                <a href="cart.html"
                    class="text-red-500 transition flex items-center gap-1.5">
                    CART
                    <span id="cart-count"
                        class="bg-red-600 text-white px-2 py-0.5 rounded-full text-xs">0</span>
                </a>

            </nav>
        </div>
    </header>

    <main class="flex-grow w-full max-w-6xl mx-auto px-4 sm:px-8 py-10 sm:py-16">

        <div class="text-center mb-10 sm:mb-12">
            <p class="text-red-500 text-xs font-bold tracking-[3px] mb-4">
                YOUR SELECTION
            </p>

            <h1 class="text-3xl sm:text-5xl font-black tracking-tight">
                SHOPPING <span class="text-red-500">CART.</span>
            </h1>

            <p class="text-gray-400 text-sm mt-5">
                Review your items before checkout.
            </p>
        </div>

        <div id="cart-container">
            <div class="grid grid-cols-1 lg:grid-cols-3 gap-8 items-start">

                <div class="lg:col-span-2 bg-[#1c1c1c] border border-[#353535] rounded-xl divide-y divide-[#353535] overflow-hidden shadow-sm">

                    <div class="p-4 sm:p-6 flex flex-col sm:flex-row items-center gap-4 sm:gap-6 justify-between">

                        <div class="flex items-center gap-4 w-full sm:w-auto flex-1 min-w-0">

                            <div class="w-16 h-16 sm:w-20 sm:h-20 bg-white border border-[#353535] rounded-lg p-1.5 flex items-center justify-center shrink-0">
                                <img
                                    src="https://cdn.dummyjson.com/product-images/beauty/essence-mascara-lash-princess/thumbnail.webp"
                                    alt="Essence Mascara Lash Princess"
                                    class="max-h-full max-w-full object-contain">
                            </div>

                            <div class="min-w-0 flex-1">
                                <a href="product-details.html"
                                    class="text-sm font-semibold text-white hover:text-red-500 line-clamp-2 transition">
                                    Essence Mascara Lash Princess
                                </a>
                                <p class="text-xs text-gray-400 mt-1">₹9.99</p>
                            </div>
                        </div>

                        <div class="flex items-center justify-between sm:justify-end gap-3 sm:gap-5 w-full sm:w-auto shrink-0">

                            <div class="flex items-center border border-[#444444] rounded-lg bg-[#252525] overflow-hidden">

                                <button type="button"
                                    class="cart-qty-minus p-2 text-white hover:text-red-500 hover:bg-[#383838] transition"
                                    aria-label="Decrease quantity">
                                    <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 12H4"></path>
                                    </svg>
                                </button>

                                <span class="w-8 text-center text-xs font-semibold text-white select-none">1</span>

                                <button type="button"
                                    class="cart-qty-plus p-2 text-white hover:text-red-500 hover:bg-[#383838] transition"
                                    aria-label="Increase quantity">
                                    <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path>
                                    </svg>
                                </button>
                            </div>

                            <div class="w-20 text-right">
                                <span class="text-sm font-bold text-white">₹9.99</span>
                            </div>

                            <button type="button"
                                class="cart-wishlist-btn text-red-500 hover:text-white p-1.5 rounded transition"
                                title="Add to Wishlist" aria-label="Add to Wishlist">
                                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                        d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z">
                                    </path>
                                </svg>
                            </button>

                            <button type="button"
                                class="cart-remove-btn text-gray-400 hover:text-red-500 p-1.5 rounded transition"
                                title="Remove from cart" aria-label="Remove item">
                                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                        d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16">
                                    </path>
                                </svg>
                            </button>

                        </div>
                    </div>
                </div>

                <div class="bg-[#1c1c1c] border border-[#353535] rounded-xl p-6 shadow-sm lg:sticky lg:top-24">

                    <h2 class="text-lg font-bold text-white mb-4 pb-3 border-b border-[#353535]">
                        Order Summary
                    </h2>

                    <div class="flex items-center justify-between gap-2 text-base font-semibold text-white mb-6">
                        <span>Total Amount</span>
                        <span class="text-xl font-bold text-red-500">₹89.97</span>
                    </div>

                    <button type="button" id="checkout-btn"
                        class="w-full bg-red-600 hover:bg-red-700 text-white font-medium py-3 px-4 rounded-lg shadow-sm transition text-center">
                        Proceed to Checkout
                    </button>

                </div>

            </div>
        </div>

    </main>

    <footer class="border-t border-[#303030] py-6 mt-auto">
        <div class="max-w-6xl mx-auto px-4 text-center text-sm text-gray-500">
            <p>© 2026 VELIX. All rights reserved.</p>
        </div>
    </footer>

    <script src="main.js"></script>

</body>

</html>
