
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VELIX | Todo App</title>
    <link rel="stylesheet" href="output.css">
</head>

<body class="bg-[#111111] min-h-screen text-white font-sans">

    <!-- Navbar -->
    <nav class="border-b border-[#303030]">
        <div class="max-w-6xl mx-auto px-5 sm:px-8 py-6 flex items-center justify-between">
            <h1 class="text-2xl font-black tracking-tight">
                VELIX<span class="text-red-500">.</span>
            </h1>
            <span class="text-xs font-semibold tracking-wider text-gray-400">
                TODO APP
            </span>
        </div>
    </nav>

    <main class="px-4 py-12 sm:py-16">

        <!-- Heading -->
        <div class="text-center mb-10 sm:mb-12">
            <p class="text-red-500 text-xs font-bold tracking-[3px] mb-4">
                JAVASCRIPT PROJECT
            </p>

            <h2 class="text-3xl sm:text-5xl font-black tracking-tight">
                VELIX <span class="text-red-500">TODO.</span>
            </h2>

            <p class="text-gray-400 text-sm mt-5">
                Simple. Clean. Productive.
            </p>
        </div>

        <!-- Todo Card -->
        <div class="w-full max-w-md mx-auto bg-[#1c1c1c] border border-[#353535] rounded-2xl p-5 sm:p-6 shadow-2xl">

            <div class="flex items-center justify-between mb-6">
                <h3 class="text-sm font-bold tracking-wide">
                    VELIX TASKS
                </h3>
                <span class="text-xs text-gray-400">
                    TASK MANAGER
                </span>
            </div>

            <!-- Form -->
            <form id="todo-form" class="flex flex-col mb-6">

                <div class="flex gap-2 sm:gap-3 mb-2">

                    <input
                        id="todo-input"
                        type="text"
                        placeholder="Enter task description..."
                        class="flex-1 min-w-0 bg-[#252525] border border-[#444444] text-white placeholder:text-gray-500 px-4 py-3 rounded-lg outline-none focus:border-red-500 transition-colors"
                    >

                    <button
                        id="form-btn"
                        type="submit"
                        class="shrink-0 px-5 py-3 bg-red-600 hover:bg-red-700 text-white font-semibold rounded-lg transition-colors cursor-pointer">
                        Add
                    </button>

                </div>

                <button
                    type="button"
                    id="cancel-btn"
                    class="hidden self-end text-xs text-gray-400 hover:text-red-400 underline cursor-pointer">
                    Cancel Editing
                </button>

            </form>

            <!-- Task Counters -->
            <div class="flex items-center justify-between gap-2 border-b border-[#353535] pb-4 mb-4 text-[10px] sm:text-xs font-semibold tracking-wide text-gray-400">

                <p id="task-count">TASKS (0)</p>

                <p id="complete-count">COMPLETED : 0</p>

            </div>

            <!-- Task List -->
            <ul
                id="todo-list"
                class="py-4 flex flex-col gap-3 min-w-0">
            </ul>

            <!-- Empty State -->
            <div
                id="empty-state"
                class="hidden text-center py-8 text-gray-500">

                <p class="text-sm">
                    No tasks found. Add a task above to get started!
                </p>

            </div>

        </div>

    </main>

    <script src="index.js"></script>

</body>

</html>
