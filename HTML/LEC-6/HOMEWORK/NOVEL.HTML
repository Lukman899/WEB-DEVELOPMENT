<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NOVEL SERVICE LOGIN</title>
</head>
<body>
    <h1>Novell Service Login</h1>
    <div>
        <form action="welcomepage.html"></form>
        <label for="Username">Username</label>
        <input type="text"  id="Username">


        <br><br>


        <label for="password">password:</label>
        <input type="password" id="password">


        <br><br>

         <label for="city">Select a city:</label>
        <select name="city" id="city">
            <option value="">khambhat</option>
            <option value="">delhi</option>
            <option value="">Ahamdabad</option>
            <option value="">Mumbai</option>
            <option value="">Vadodara</option>
        </select>


        <br><br>

        <label for="Employment">Employment:</label>
        <input type="Employment" id="Employment">
        <br><br>


        <label for="server">Web server:</label>
        <select name="server" id="server">
            <option value="server 1">server 1</option>
            <option value="server 2">server 2</option>
            <option value="server 3">server 3</option>
            <option value="server 4">server 4</option>
            <option value="server 5">server 5</option>
        </select>


        <br><br>


        <p>Please specify your role:
</p>
        <label for="radio">admin</label>
        <input type="radio" name="radio">

        <br>

        <label for="radio">Engineer</label>
        <input type="radio" name="radio">

        <br>

        <label for="radio">Manager</label>
        <input type="radio" name="radio">

        <br>

        <label for="radio">Guest</label>
        <input type="radio" name="radio">


        <br><br>


         <p>Single SignOn To the following
</p>
        <label for="Checkbox">Mail</label>
        <input type="Checkbox"">

        <br>

        <label for="Checkbox">Payroll</label>
        <input type="Checkbox">

        <br>

        <label for="Checkbox">SelfService</label>
        <input type="Checkbox">

        <br><br>

        <button>Login</button>
        <button>Reset</button>

    </div>
</body>
</html>
